[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "osc-metadata-client"
dynamic = ["version"]
description = 'Open Science Catalog client'
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = []
authors = [
  { name = "Simone Tripodi", email = "simone.tripodi@terradue.com" },
  { name = "Fabrice Brito", email = "fabrice.brito@terradue.com" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
]
dependencies = [
  "click==8.4.2",
  "loguru==0.7.3",
  "ogc-api-processes-client==0.6.0",
  "pydantic==2.13.4",
  "transpiler-mate==0.50.0",
  "pystac==1.15.2"
]

[tool.hatch.metadata]
allow-direct-references = true

[project.urls]
Documentation = "https://terradue.github.io/osc-metadata-client/"
Issues = "https://github.com/Terradue/osc-metadata-client/issues"
Source = "https://github.com/Terradue/osc-metadata-client"

[project.scripts]
osc-metadata-client = "osc_metadata_client.cli:main"

[tool.hatch.version]
path = "src/osc_metadata_client/__about__.py"

[tool.coverage.run]
source_pkgs = ["osc_metadata_client", "tests"]
branch = true
parallel = true
omit = [
  "src/osc_metadata_client/__about__.py",
]

[tool.coverage.paths]
osc_metadata_client = ["src/osc_metadata_client", "*/osc-metadata-client/src/osc_metadata_client"]
tests = ["tests", "*/osc-metadata-client/tests"]

[tool.coverage.report]
exclude_lines = [
  "no cov",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]

[tool.hatch.envs.test]
skip-install = false
dependencies = [
  "httpx>=0.27",
  "pytest>=8.4,<10",
  "pytest-cov>=6.2,<8",
]

[tool.hatch.envs.test.scripts]
test = "pytest {args:tests}"
testv = "pytest --verbose {args:tests}"
test-cov = "pytest --cov=osc_metadata_client --cov-report=term-missing {args:tests}"
test-show-setup = "pytest --setup-show"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
  "--strict-config",
  "--strict-markers",
]

[[tool.hatch.envs.test.matrix]]
python = ["3.10", "3.11", "3.12", "3.13", "3.14"]

[tool.hatch.envs.dev]
skip-install = false
dependencies = [
  "pytest>=8.4,<10",
  "mypy>=2.3.0",
  "ruff>=0.16.0",
  "bandit>=1.9.4",
]

[tool.ruff.lint]
# Start with the essential rules
select = [
  "F",    # Pyflakes (Critical for bugs)
  "E",    # pycodestyle Errors
  "W",    # pycodestyle Warnings
  "I",    # isort (Import sorting)
  "UP",   # pyupgrade (Modern syntax)
  "B",    # flake8-bugbear (Common bugs)
  "C4",   # flake8-comprehensions
  "SIM",  # flake8-simplify
  "FA",   # flake8-future-annotations
  "TC",   # flake8-type-checking
  "PTH",  # flake8-use-pathlib
  "RET",  # flake8-return
  "C90",  # McCabe Complexity (Enables C901)
]

# Ignore rules that conflict with the formatter (Ruff Format/Black)
ignore = [
  "E501", # Line too long (handled by formatter)
  "W191", # Tab indentation (handled by formatter)
  "E111", # Indentation issues (handled by formatter)
  "E114", # Indentation issues (handled by formatter)
  "E117", # Over-indented (handled by formatter)
]

[tool.ruff.lint.mccabe]
# Flag errors (C901) whenever complexity exceeds 10 (default is 10)
max-complexity = 10

[tool.ruff.lint.flake8-type-checking]
# Pydantic resolves these annotations while rebuilding model schemas.
runtime-evaluated-base-classes = [
  "pydantic.BaseModel",
  "TranspilerBaseModel",
  "transpiler_mate.TranspilerBaseModel",
]

[tool.hatch.envs.dev.scripts]
typecheck = "mypy --install-types --non-interactive {args:src/osc_metadata_client}"
lint = "ruff format {args:src tests}"
check = "ruff check --fix {args:src tests}"
security = "bandit -r {args:src}"

[tool.mypy]
# Several generated dependencies do not publish a py.typed marker.
disable_error_code = ["import-untyped"]
